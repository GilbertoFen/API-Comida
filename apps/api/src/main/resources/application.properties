spring.application.name=appfoodspring-api
server.port=${SERVER_PORT:8081}
spring.config.import=optional:file:.env[.properties],optional:file:apps/api/.env[.properties]

spring.datasource.url=${SUPABASE_DB_URL:${SPRING_DATASOURCE_URL:}}
spring.datasource.username=${SUPABASE_DB_USER:${SPRING_DATASOURCE_USERNAME:}}
spring.datasource.password=${SUPABASE_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_MIN_IDLE:2}
spring.datasource.hikari.data-source-properties.sslmode=${SPRING_DATASOURCE_SSLMODE:require}

app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:VGhpc0lzQVN0cm9uZ1Rlc3RTZWNyZXRGb3JBcHBGb29kU3ByaW5nSldUMjAyNg==}
app.security.jwt.access-expiration-seconds=${APP_SECURITY_JWT_ACCESS_EXPIRATION_SECONDS:3600}
app.security.jwt.refresh-expiration-seconds=${APP_SECURITY_JWT_REFRESH_EXPIRATION_SECONDS:604800}
app.ai.enabled=${APP_AI_ENABLED:true}
app.external.openfoodfacts.base-url=${APP_EXTERNAL_OPENFOODFACTS_BASE_URL:https://world.openfoodfacts.org}
app.external.openfoodfacts.page-size=${APP_EXTERNAL_OPENFOODFACTS_PAGE_SIZE:10}
app.external.openfoodfacts.timeout-seconds=${APP_EXTERNAL_OPENFOODFACTS_TIMEOUT_SECONDS:8}

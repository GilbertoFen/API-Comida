<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Comida</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container mt-4">
    <h1 class="text-center">Base de datos de alimentos y recetas</h1>
    <div class="mb-3 d-flex justify-content-center container-Y" >
        <p>
            Conexión de una API REST desarrollada en SpringBoot a una base de datos MariaDB para acceder a alimentos de la base de datos, consultar recetas y crear nuevas.
        </p>
    </div>
    <div class="mb-3 d-flex justify-content-center">

        <button class="btn me-2 btn-Y" onclick="mostrarBusquedaAlimentos()">Buscar Alimentos</button>
        <button class="btn  btn-Y" onclick="mostrarBusquedaRecetas()">Buscar Recetas</button>
    </div>

    <div id="busquedaAlimentos" class="mt-3" style="display: none;">
        <h3>Buscar Alimentos</h3>
        <div class="input-group mb-3">
            <input type="text" id="buscarAlimentoInput" class="form-control" placeholder="Buscar alimento por nombre">
            <button class="btn btn-Y" onclick="buscarAlimento()">Buscar</button>
        </div>
        <button class="btn btn-outline-secondary mb-3" onclick="cargarAlimentos()">Mostrar Todos los Alimentos</button>

        <div id="resultadosAlimentos" class="row"></div>
    </div>

    <div id="busquedaRecetas" class="mt-3" style="display: none;">
        <h3>Buscar Recetas</h3>
        <div class="input-group mb-3">
            <input type="text" id="buscarRecetaInput" class="form-control" placeholder="Buscar receta por nombre">
            <button class="btn btn-Y" onclick="buscarReceta()">Buscar</button>
        </div>
        <button class="btn btn-outline-secondary mb-3" onclick="cargarRecetas()">Mostrar Todas las Recetas</button>

        <div id="resultadosRecetas" class="row"></div>
    </div>
    <div id="crearRecetaSection" class="mt-4" style="display: none;">
        <h3>Crear Nueva Receta</h3>
        <form id="crearRecetaForm">
            <div class="mb-3">
                <label for="nombreReceta" class="form-label">Nombre de la receta</label>
                <input type="text" id="nombreReceta" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="descripcionReceta" class="form-label">Descripción</label>
                <textarea id="descripcionReceta" class="form-control"></textarea>
            </div>
            <div class="mb-3">
                <label for="instruccionesReceta" class="form-label">Instrucciones</label>
                <textarea id="instruccionesReceta" class="form-control"></textarea>
            </div>
            <div class="mb-3">
                <h5>Seleccionar ingredientes</h5>
                <div id="seleccionarAlimentos"></div>
            </div>
            <button type="button" class="btn btn-Y" onclick="crearReceta()">Crear Receta</button>
        </form>
    </div>

</div>

<script src="index.js"></script>
</body>
</html>
